spring.application.name=field-service-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/field_service_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=${PORT:8080}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.seed.enabled=${APP_SEED_ENABLED:true}
app.upload.dir=${UPLOAD_DIR:uploads}
app.jwt.secret=${JWT_SECRET:}
app.jwt.salt=${JWT_SALT:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://field-service-platform-gilt.vercel.app,https://*.vercel.app}